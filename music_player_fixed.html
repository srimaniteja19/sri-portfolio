
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,700&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EDE4;--ink:#0A0A09;--dim:#7A7870;
  --mint:#7EEDC4;--coral:#FF8A7A;--lemon:#F5E642;
  --sky:#7EC8F5;--lilac:#C4A8FF;--peach:#FFB876;
  --mono:'JetBrains Mono',monospace;
  --serif:'Fraunces',serif;
  --sans:'DM Sans',sans-serif
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);cursor:none}
#cur{position:fixed;width:11px;height:11px;border:2.5px solid var(--ink);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .1s,height .1s,background .1s;top:0;left:0}
#cur.h{width:38px;height:38px;background:var(--lemon);border-color:var(--lemon);mix-blend-mode:multiply}

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.wrap{background:var(--bg);border:2.5px solid var(--ink);border-radius:0;overflow:hidden;max-width:100%}

/* ── TOP NOW-PLAYING BAR ── */
.topbar{display:flex;align-items:stretch;border-bottom:2.5px solid var(--ink);min-height:64px}
.tb-disc{width:64px;display:flex;align-items:center;justify-content:center;border-right:2.5px solid var(--ink);font-size:1.6rem;flex-shrink:0;background:var(--ink);transition:background .3s}
.tb-disc.spin{animation:spin 3s linear infinite}
.tb-info{flex:1;padding:.6rem 1rem;border-right:2.5px solid var(--ink);overflow:hidden;min-width:0}
.tb-title{font-family:var(--serif);font-size:1rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tb-artist{font-family:var(--mono);font-size:.55rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:.15rem}
.tb-tag{display:inline-block;font-family:var(--mono);font-size:.5rem;font-weight:700;padding:.1rem .4rem;border:1.5px solid var(--ink);border-radius:2px;margin-top:.3rem}

/* ── CONTROLS ── */
.ctrl-row{display:flex;align-items:stretch;border-bottom:2.5px solid var(--ink)}
.ctrl-btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:1rem;height:46px;border-right:2px solid var(--ink);background:transparent;cursor:none;transition:background .12s;border-top:none;border-bottom:none;border-left:none;border-radius:0;color:var(--ink)}
.ctrl-btn:last-child{border-right:none}
.ctrl-btn:hover{background:var(--ink);color:var(--bg)}
.ctrl-btn.on{background:var(--mint)}
.ctrl-btn.play-btn{background:var(--lemon);font-size:1.3rem;flex:1.5}
.ctrl-btn.play-btn:hover{background:var(--ink);color:var(--lemon)}

/* ── PROGRESS ── */
.prog-wrap{padding:.7rem 1rem;border-bottom:2.5px solid var(--ink)}
.prog-bar{height:8px;background:rgba(10,10,9,.08);border:2px solid var(--ink);border-radius:0;cursor:none;position:relative;overflow:hidden}
.prog-fill{height:100%;background:var(--ink);width:0%;transition:width .4s linear;pointer-events:none}
.prog-times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.54rem;color:var(--dim);margin-top:.3rem}
.vol-row{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
.vol-icon{font-size:.9rem;cursor:none;flex-shrink:0}
.vol-track{flex:1;height:6px;background:rgba(10,10,9,.08);border:1.5px solid rgba(10,10,9,.2);cursor:none;position:relative}
.vol-fill{height:100%;background:var(--ink);pointer-events:none;width:80%}

/* ── PLAYLIST ── */
.pl-header{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;border-bottom:2px solid var(--ink);background:var(--ink)}
.pl-header span{font-family:var(--mono);font-size:.58rem;font-weight:700;color:var(--bg);text-transform:uppercase;letter-spacing:.12em}
.pl-list{display:flex;flex-direction:column}
.pl-row{display:grid;grid-template-columns:28px 1fr auto;gap:.5rem;align-items:center;padding:.55rem 1rem;border-bottom:1px solid rgba(10,10,9,.07);cursor:none;transition:background .12s}
.pl-row:last-child{border-bottom:none}
.pl-row:hover{background:rgba(10,10,9,.05)}
.pl-row.active{background:var(--mint)}
.pl-row.active:hover{background:rgba(126,237,196,.75)}
.pl-num{font-family:var(--mono);font-size:.58rem;color:var(--dim);font-weight:700;text-align:center}
.pl-row.active .pl-num{color:var(--ink)}
.pl-name{font-size:.75rem;font-weight:700;line-height:1.2}
.pl-sub{font-family:var(--mono);font-size:.54rem;color:var(--dim)}
.pl-row.active .pl-sub{color:rgba(10,10,9,.55)}
.pl-dur{font-family:var(--mono);font-size:.54rem;color:var(--dim);white-space:nowrap}
.pl-mood{font-family:var(--mono);font-size:.5rem;font-weight:700;padding:.1rem .35rem;border:1.5px solid var(--ink);border-radius:2px;margin-top:2px;display:inline-block}

/* ── VISUALIZER ── */
.vis-header{display:flex;align-items:center;justify-content:space-between;padding:.5rem 1rem;border-top:2.5px solid var(--ink);border-bottom:2px solid var(--ink)}
.vis-lbl{font-family:var(--mono);font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.vis-modes{display:flex;gap:.3rem}
.vis-mode-btn{font-family:var(--mono);font-size:.5rem;font-weight:700;padding:.18rem .5rem;border:1.5px solid var(--ink);border-radius:2px;background:transparent;cursor:none;transition:all .1s;text-transform:uppercase;color:var(--ink)}
.vis-mode-btn:hover,.vis-mode-btn.active{background:var(--ink);color:var(--bg)}
#visCanvas{width:100%;height:160px;display:block}

/* ── UPLOAD SECTION ── */
.upload-sec{padding:.8rem 1rem;border-top:2.5px solid var(--ink)}
.upload-title{font-family:var(--mono);font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.upload-title::before{content:'//'}
.drop-zone{border:2px dashed rgba(10,10,9,.3);padding:1rem;text-align:center;border-radius:4px;position:relative;transition:all .15s;cursor:none}
.drop-zone:hover,.drop-zone.over{border-color:var(--ink);background:rgba(10,10,9,.03)}
.drop-zone input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:none}
.drop-inner{pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.drop-icon{font-size:1.5rem}
.drop-lbl{font-family:var(--mono);font-size:.65rem;font-weight:700}
.drop-sub{font-family:var(--mono);font-size:.54rem;color:var(--dim)}
.upload-status{font-family:var(--mono);font-size:.58rem;color:var(--dim);margin-top:.4rem;min-height:1rem}

/* ── BOTTOM CONTROLS ── */
.bottom-bar{display:flex;align-items:center;border-top:2.5px solid var(--ink)}
.bb-btn{flex:1;padding:.45rem .5rem;font-family:var(--mono);font-size:.56rem;font-weight:700;text-align:center;border-right:2px solid var(--ink);background:transparent;cursor:none;transition:background .12s;text-transform:uppercase;letter-spacing:.04em;border-top:none;border-bottom:none;border-left:none;border-radius:0;color:var(--ink)}
.bb-btn:last-child{border-right:none}
.bb-btn:hover{background:var(--ink);color:var(--bg)}
.kb-hint{padding:.35rem .8rem;border-top:2px solid rgba(10,10,9,.1);font-family:var(--mono);font-size:.5rem;color:var(--dim);display:flex;flex-wrap:wrap;gap:.5rem}
.kb-hint b{color:var(--ink)}
</style>

<div id="cur"></div>

<div class="wrap" id="playerWrap">

  <!-- TOP BAR: disc + info -->
  <div class="topbar">
    <div class="tb-disc" id="disc">🎵</div>
    <div class="tb-info">
      <div class="tb-title" id="nowTitle">choose a track below</div>
      <div class="tb-artist" id="nowArtist">// click any track to play</div>
      <span class="tb-tag" id="nowTag" style="background:var(--mint)">ready</span>
    </div>
    <!-- live eq bars when playing -->
    <div style="display:flex;align-items:flex-end;gap:3px;padding:.8rem 1rem;border-left:2.5px solid var(--ink)">
      <div class="eq-live" style="width:5px;background:var(--mint);border:1px solid var(--ink);height:8px;transition:height .1s"></div>
      <div class="eq-live" style="width:5px;background:var(--lemon);border:1px solid var(--ink);height:14px;transition:height .1s"></div>
      <div class="eq-live" style="width:5px;background:var(--coral);border:1px solid var(--ink);height:10px;transition:height .1s"></div>
      <div class="eq-live" style="width:5px;background:var(--sky);border:1px solid var(--ink);height:18px;transition:height .1s"></div>
      <div class="eq-live" style="width:5px;background:var(--lilac);border:1px solid var(--ink);height:6px;transition:height .1s"></div>
    </div>
  </div>

  <!-- TRANSPORT CONTROLS -->
  <div class="ctrl-row">
    <button class="ctrl-btn" id="btnShuffle" onclick="toggleShuffle()" title="shuffle (S)">⇄</button>
    <button class="ctrl-btn" onclick="doPrev()" title="previous (←)">⏮</button>
    <button class="ctrl-btn play-btn" id="btnPlay" onclick="doPlayPause()" title="play/pause (Space)">▶</button>
    <button class="ctrl-btn" onclick="doNext()" title="next (→)">⏭</button>
    <button class="ctrl-btn" id="btnRepeat" onclick="toggleRepeat()" title="repeat (R)">↺</button>
    <button class="ctrl-btn" id="btnMute" onclick="toggleMute()" title="mute (M)">🔊</button>
  </div>

  <!-- PROGRESS + VOLUME -->
  <div class="prog-wrap">
    <div class="prog-bar" id="progBar" onclick="seekTo(event)">
      <div class="prog-fill" id="progFill"></div>
    </div>
    <div class="prog-times">
      <span id="timeCur">0:00</span>
      <span id="timeTot">0:00</span>
    </div>
    <div class="vol-row">
      <span class="vol-icon" id="volIcon">🔊</span>
      <div class="vol-track" id="volTrack" onclick="setVol(event)">
        <div class="vol-fill" id="volFill"></div>
      </div>
      <span style="font-family:var(--mono);font-size:.54rem;color:var(--dim)" id="volPct">80%</span>
    </div>
  </div>

  <!-- PLAYLIST -->
  <div class="pl-header">
    <span>playlist</span>
    <span id="plCount" style="opacity:.5">0 tracks</span>
  </div>
  <div class="pl-list" id="plList"></div>

  <!-- VISUALIZER -->
  <div class="vis-header">
    <span class="vis-lbl">visualizer</span>
    <div class="vis-modes">
      <button class="vis-mode-btn active" onclick="setVis('bars',this)">bars</button>
      <button class="vis-mode-btn" onclick="setVis('wave',this)">wave</button>
      <button class="vis-mode-btn" onclick="setVis('circle',this)">circle</button>
      <button class="vis-mode-btn" onclick="setVis('mirror',this)">mirror</button>
    </div>
  </div>
  <canvas id="visCanvas"></canvas>

  <!-- UPLOAD -->
  <div class="upload-sec">
    <div class="upload-title">add your own music</div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="audio/*" multiple onchange="onFileInput(event)"/>
      <div class="drop-inner">
        <span class="drop-icon">🎵</span>
        <span class="drop-lbl">drop files here or click to browse</span>
        <span class="drop-sub">supports mp3 · wav · ogg · flac · m4a · aac</span>
      </div>
    </div>
    <div class="upload-status" id="uploadStatus"></div>
  </div>

  <!-- BOTTOM ACTIONS -->
  <div class="bottom-bar">
    <button class="bb-btn" onclick="shareNow()">share track</button>
    <button class="bb-btn" onclick="exportPL()">export playlist</button>
    <button class="bb-btn" onclick="clearUploaded()">clear uploads</button>
  </div>

  <div class="kb-hint">
    <span><b>space</b> play/pause</span>
    <span><b>← →</b> prev/next</span>
    <span><b>↑ ↓</b> volume</span>
    <span><b>S</b> shuffle</span>
    <span><b>R</b> repeat</span>
    <span><b>M</b> mute</span>
  </div>

</div>

<script>
/* ── CURSOR ── */
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
document.querySelectorAll('button,.pl-row,.drop-zone,.bb-btn,.vis-mode-btn').forEach(el=>{
  el.addEventListener('mouseenter',()=>cur.classList.add('h'));
  el.addEventListener('mouseleave',()=>cur.classList.remove('h'));
});

/* ── TRACKS (demo — no src means simulated) ── */
const COLORS=['#7EEDC4','#F5E642','#FF8A7A','#7EC8F5','#C4A8FF','#FFB876'];
let tracks=[
  {id:1,title:'Lofi Study Beat',artist:'ChilledCow Vibes',duration:'3:42',mood:'chill',color:'#7EEDC4',emoji:'🌿',bpm:72},
  {id:2,title:'Focus Flow',artist:'Deep Work Radio',duration:'4:15',mood:'focus',color:'#7EC8F5',emoji:'🧠',bpm:85},
  {id:3,title:'Late Night Coding',artist:'Dev Playlist',duration:'5:01',mood:'late',color:'#C4A8FF',emoji:'🌙',bpm:90},
  {id:4,title:'Morning Energy',artist:'Productivity Beats',duration:'3:28',mood:'energy',color:'#FF8A7A',emoji:'⚡',bpm:128},
  {id:5,title:'Cafe Ambience',artist:'Background Noise',duration:'6:12',mood:'chill',color:'#FFB876',emoji:'☕',bpm:60},
  {id:6,title:'Deep Focus Alpha',artist:'Binaural Lab',duration:'4:48',mood:'focus',color:'#7EC8F5',emoji:'🎯',bpm:74},
];

/* ── STATE ── */
let curIdx=-1,isPlaying=false,isShuffle=false,isRepeat=false,vol=0.8,isMuted=false;
let curAudio=null,visMode='bars',visRaf=null;
let simProgress=0,simTotal=0,simInterval=null;
let fakeData=new Uint8Array(64);
let fakePhase=0;
let audioCtx=null,analyser=null,audioSrc=null;

/* ── FAKE FREQ DATA for demo tracks ── */
function updateFake(bpm){
  fakePhase+=0.06;
  const beat=Math.max(0,Math.sin(fakePhase*(bpm/60)*Math.PI));
  for(let i=0;i<fakeData.length;i++){
    const base=i<3?200+beat*60:i<10?130:i<25?70:25;
    const decay=Math.exp(-i/18);
    fakeData[i]=Math.max(0,Math.min(255,base*decay+Math.random()*30-15+(i<5?beat*80:0)));
  }
}

/* ── RENDER PLAYLIST ── */
function renderPL(){
  const list=document.getElementById('plList');
  list.innerHTML='';
  tracks.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='pl-row'+(i===curIdx?' active':'');
    row.innerHTML=`
      <div class="pl-num">${i===curIdx&&isPlaying?'▶':i+1}</div>
      <div>
        <div class="pl-name">${t.emoji||'🎵'} ${t.title}</div>
        <div class="pl-sub">${t.artist}</div>
      </div>
      <div style="text-align:right">
        <div class="pl-dur">${t.duration}</div>
        <span class="pl-mood" style="background:${t.color}">${t.mood}</span>
      </div>`;
    row.addEventListener('click',()=>playIdx(i));
    row.addEventListener('mouseenter',()=>cur.classList.add('h'));
    row.addEventListener('mouseleave',()=>cur.classList.remove('h'));
    list.appendChild(row);
  });
  document.getElementById('plCount').textContent=tracks.length+' tracks';
}

/* ── PARSE DURATION ── */
function parseDur(s){const[m,sec]=s.split(':').map(Number);return m*60+sec;}
function fmtTime(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}

/* ── STOP CURRENT ── */
function stopCurrent(){
  clearInterval(simInterval); simInterval=null; simProgress=0;
  if(curAudio){try{curAudio.pause();}catch(e){}curAudio=null;}
  if(audioSrc){try{audioSrc.disconnect();}catch(e){}}
  document.getElementById('progFill').style.width='0%';
  document.getElementById('timeCur').textContent='0:00';
}

/* ── PLAY BY INDEX ── */
function playIdx(i){
  if(i<0||i>=tracks.length)return;
  stopCurrent();
  curIdx=i;
  const t=tracks[i];
  simTotal=parseDur(t.duration);

  // Update UI header
  document.getElementById('nowTitle').textContent=t.title;
  document.getElementById('nowArtist').textContent=t.artist;
  document.getElementById('nowTag').textContent=t.mood;
  document.getElementById('nowTag').style.background=t.color;
  const disc=document.getElementById('disc');
  disc.textContent=t.emoji||'🎵';
  disc.style.background=t.color;
  disc.classList.add('spin');
  document.getElementById('timeTot').textContent=t.duration;
  document.getElementById('btnPlay').textContent='⏸';
  isPlaying=true;
  renderPL();
  animateEQ();

  if(t._audioEl){
    // Real uploaded file
    const audio=t._audioEl;
    curAudio=audio;
    audio.volume=isMuted?0:vol;
    // Wire up Web Audio for visualizer
    try{
      if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
      if(audioCtx.state==='suspended')audioCtx.resume();
      if(analyser){try{analyser.disconnect();}catch(e){}}
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=128;
      analyser.smoothingTimeConstant=0.8;
      if(audioSrc){try{audioSrc.disconnect();}catch(e){}}
      // Only create source once per audio element
      if(!audio._wired){
        audioSrc=audioCtx.createMediaElementSource(audio);
        audio._wired=true;
      }
      audioSrc.connect(analyser);
      analyser.connect(audioCtx.destination);
    }catch(e){console.log('WebAudio warn:',e);}
    audio.currentTime=0;
    const playPromise=audio.play();
    if(playPromise){playPromise.catch(e=>{console.log('play err:',e);setSim(t);});}
    audio.ontimeupdate=()=>{
      if(!audio.duration)return;
      const p=(audio.currentTime/audio.duration)*100;
      document.getElementById('progFill').style.width=p+'%';
      document.getElementById('timeCur').textContent=fmtTime(audio.currentTime);
    };
    audio.onended=()=>{if(isRepeat)playIdx(curIdx);else doNext();};
  } else {
    // Demo track — simulate progress
    setSim(t);
  }
}

function setSim(t){
  simProgress=0;
  simTotal=parseDur(t.duration);
  clearInterval(simInterval);
  simInterval=setInterval(()=>{
    if(!isPlaying)return;
    simProgress+=0.25;
    if(simProgress>=simTotal){
      clearInterval(simInterval);
      if(isRepeat)playIdx(curIdx);else doNext();
      return;
    }
    const p=(simProgress/simTotal)*100;
    document.getElementById('progFill').style.width=p+'%';
    document.getElementById('timeCur').textContent=fmtTime(simProgress);
    updateFake(t.bpm||80);
  },250);
}

/* ── CONTROLS ── */
function doPlayPause(){
  if(curIdx<0){playIdx(0);return;}
  if(isPlaying){
    isPlaying=false;
    if(curAudio){curAudio.pause();}
    clearInterval(simInterval);
    document.getElementById('btnPlay').textContent='▶';
    document.getElementById('disc').classList.remove('spin');
    renderPL();
  } else {
    isPlaying=true;
    if(curAudio){
      if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
      curAudio.play().catch(e=>{});
    } else {
      setSim(tracks[curIdx]);
    }
    document.getElementById('btnPlay').textContent='⏸';
    document.getElementById('disc').classList.add('spin');
    animateEQ();
    renderPL();
  }
}

function doPrev(){
  let i=isShuffle?Math.floor(Math.random()*tracks.length):curIdx-1;
  if(i<0)i=tracks.length-1;
  playIdx(i);
}

function doNext(){
  let i=isShuffle?Math.floor(Math.random()*tracks.length):curIdx+1;
  if(i>=tracks.length)i=0;
  playIdx(i);
}

function toggleShuffle(){
  isShuffle=!isShuffle;
  document.getElementById('btnShuffle').classList.toggle('on',isShuffle);
}

function toggleRepeat(){
  isRepeat=!isRepeat;
  document.getElementById('btnRepeat').classList.toggle('on',isRepeat);
}

function toggleMute(){
  isMuted=!isMuted;
  if(curAudio)curAudio.volume=isMuted?0:vol;
  document.getElementById('btnMute').textContent=isMuted?'🔇':'🔊';
  document.getElementById('volIcon').textContent=isMuted?'🔇':'🔊';
  document.getElementById('volFill').style.width=isMuted?'0%':(vol*100)+'%';
}

function setVol(e){
  const r=document.getElementById('volTrack').getBoundingClientRect();
  vol=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  document.getElementById('volFill').style.width=(vol*100)+'%';
  document.getElementById('volPct').textContent=Math.round(vol*100)+'%';
  if(curAudio)curAudio.volume=vol;
  isMuted=false;
  document.getElementById('btnMute').textContent='🔊';
}

function seekTo(e){
  if(curIdx<0)return;
  const r=document.getElementById('progBar').getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  document.getElementById('progFill').style.width=(pct*100)+'%';
  const t=tracks[curIdx];
  const total=parseDur(t.duration);
  const seekS=pct*total;
  document.getElementById('timeCur').textContent=fmtTime(seekS);
  if(curAudio&&curAudio.duration){curAudio.currentTime=seekS;}
  else{simProgress=seekS;}
}

/* ── EQ LIVE ANIMATION ── */
function animateEQ(){
  const bars=document.querySelectorAll('.eq-live');
  if(!isPlaying){bars.forEach(b=>b.style.height='4px');return;}
  bars.forEach(b=>{
    const h=6+Math.random()*22;
    b.style.height=h+'px';
  });
  setTimeout(animateEQ,120);
}

/* ── FILE UPLOAD ── */
function onFileInput(e){
  const files=[...e.target.files];
  loadFiles(files);
  e.target.value='';
}

function loadFiles(files){
  if(!files.length)return;
  let loaded=0;
  document.getElementById('uploadStatus').textContent='⟳ loading '+files.length+' file(s)...';
  files.forEach(file=>{
    if(!file.type.startsWith('audio/'))return;
    const url=URL.createObjectURL(file);
    const audio=new Audio();
    audio.preload='metadata';
    audio.src=url;
    audio.addEventListener('loadedmetadata',()=>{
      const dur=fmtTime(audio.duration);
      const name=file.name.replace(/\.[^/.]+$/,'').substring(0,35);
      const moodGuess=name.toLowerCase().includes('chill')||name.toLowerCase().includes('lofi')?'chill':name.toLowerCase().includes('focus')?'focus':name.toLowerCase().includes('energy')||name.toLowerCase().includes('hype')?'energy':'chill';
      const colIdx=tracks.length%COLORS.length;
      const t={
        id:'u'+Date.now()+Math.random(),
        title:name,
        artist:file.type.split('/')[1]?.toUpperCase()||'AUDIO',
        duration:dur,
        mood:moodGuess,
        color:COLORS[colIdx],
        emoji:'🎵',
        bpm:90,
        _audioEl:audio,
        _uploaded:true
      };
      tracks.push(t);
      loaded++;
      document.getElementById('uploadStatus').textContent=`✓ added: "${t.title}" (${dur})`;
      renderPL();
      if(loaded===files.length&&files.length>1){
        document.getElementById('uploadStatus').textContent=`✓ ${files.length} tracks added`;
      }
    });
    audio.addEventListener('error',()=>{
      document.getElementById('uploadStatus').textContent='⚠ could not load: '+file.name;
    });
  });
}

/* ── VISUALIZER ── */
const vc=document.getElementById('visCanvas');
const vx=vc.getContext('2d');
function resizeVis(){vc.width=vc.offsetWidth;vc.height=160;}
resizeVis();window.addEventListener('resize',resizeVis);

function setVis(mode,btn){
  visMode=mode;
  document.querySelectorAll('.vis-mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function getFreq(){
  if(analyser&&curAudio&&!curAudio.paused){
    const d=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(d);
    return d;
  }
  return fakeData;
}

function drawVis(){
  visRaf=requestAnimationFrame(drawVis);
  const W=vc.width,H=vc.height;
  const d=getFreq();
  vx.clearRect(0,0,W,H);
  vx.fillStyle='#F0EDE4';
  vx.fillRect(0,0,W,H);
  const t=curIdx>=0?tracks[curIdx]:null;
  const col=t?t.color:'#7EEDC4';

  if(visMode==='bars'){
    const n=Math.min(48,d.length);
    const bw=Math.floor((W-n)/n);
    for(let i=0;i<n;i++){
      const v=d[i]/255;
      const h=Math.max(3,v*(H-10));
      const x=i*(bw+1);
      vx.fillStyle=i%3===0?col:i%3===1?'#0A0A09':COLORS[i%COLORS.length];
      vx.fillRect(x,H-h,bw,h);
      vx.strokeStyle='#0A0A09';vx.lineWidth=1;
      vx.strokeRect(x,H-h,bw,h);
    }
  } else if(visMode==='wave'){
    const n=d.length;
    vx.beginPath();vx.strokeStyle='#0A0A09';vx.lineWidth=2.5;
    for(let i=0;i<n;i++){const x=i/n*W;const y=H/2+(d[i]/255-.5)*H*.75;i===0?vx.moveTo(x,y):vx.lineTo(x,y);}
    vx.stroke();
    vx.beginPath();vx.strokeStyle=col;vx.lineWidth=1.5;vx.globalAlpha=.55;
    for(let i=0;i<n;i++){const x=i/n*W;const y=H/2+(d[i]/255-.5)*H*.55+4;i===0?vx.moveTo(x,y):vx.lineTo(x,y);}
    vx.stroke();vx.globalAlpha=1;
  } else if(visMode==='circle'){
    const cx=W/2,cy=H/2,r=Math.min(W,H)*.28;
    const n=Math.min(80,d.length);
    vx.beginPath();vx.arc(cx,cy,r,0,Math.PI*2);vx.strokeStyle='rgba(10,10,9,.12)';vx.lineWidth=1;vx.stroke();
    for(let i=0;i<n;i++){
      const ang=i/n*Math.PI*2-Math.PI/2;
      const amp=d[i]/255*r*.85;
      vx.beginPath();
      vx.moveTo(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r);
      vx.lineTo(cx+Math.cos(ang)*(r+amp),cy+Math.sin(ang)*(r+amp));
      vx.strokeStyle=i%2===0?col:'#0A0A09';vx.lineWidth=2;vx.stroke();
    }
    vx.beginPath();vx.arc(cx,cy,10,0,Math.PI*2);
    vx.fillStyle=col;vx.fill();vx.strokeStyle='#0A0A09';vx.lineWidth=2;vx.stroke();
  } else if(visMode==='mirror'){
    const n=Math.min(48,d.length);
    const bw=Math.floor((W-n)/n);
    for(let i=0;i<n;i++){
      const v=d[i]/255;const h=Math.max(3,v*(H/2-5));const x=i*(bw+1);
      vx.fillStyle=i%2===0?col:'#0A0A09';
      vx.fillRect(x,H/2-h,bw,h);
      vx.fillRect(x,H/2,bw,h);
      vx.strokeStyle='rgba(10,10,9,.25)';vx.lineWidth=1;
      vx.strokeRect(x,H/2-h,bw,h);vx.strokeRect(x,H/2,bw,h);
    }
    vx.beginPath();vx.moveTo(0,H/2);vx.lineTo(W,H/2);
    vx.strokeStyle='#0A0A09';vx.lineWidth=2;vx.stroke();
  }
}
drawVis();

function shareNow(){
  if(curIdx<0){alert('play a track first');return;}
  const t=tracks[curIdx];
  const txt=`Browsing Maniteja's portfolio while vibing to: ${t.emoji} "${t.title}" — nishantdev.space`;

    document.getElementById('uploadStatus').textContent='✓ copied to clipboard!';

  });
}
function exportPL(){
  const data=JSON.stringify(tracks.map(t=>({title:t.title,artist:t.artist,mood:t.mood,duration:t.duration})),null,2);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='maniteja_playlist.json';a.click();
}
function clearUploaded(){
  tracks=tracks.filter(t=>!t._uploaded);
  if(curIdx>=tracks.length){stopCurrent();curIdx=-1;isPlaying=false;document.getElementById('btnPlay').textContent='▶';document.getElementById('disc').classList.remove('spin');}
  renderPL();
  document.getElementById('uploadStatus').textContent='uploads cleared';
  setTimeout(()=>document.getElementById('uploadStatus').textContent='',1500);
}

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();doPlayPause();}
  else if(e.code==='ArrowRight'){e.preventDefault();doNext();}
  else if(e.code==='ArrowLeft'){e.preventDefault();doPrev();}
  else if(e.code==='ArrowUp'){e.preventDefault();vol=Math.min(1,vol+.1);document.getElementById('volFill').style.width=(vol*100)+'%';document.getElementById('volPct').textContent=Math.round(vol*100)+'%';if(curAudio)curAudio.volume=vol;}
  else if(e.code==='ArrowDown'){e.preventDefault();vol=Math.max(0,vol-.1);document.getElementById('volFill').style.width=(vol*100)+'%';document.getElementById('volPct').textContent=Math.round(vol*100)+'%';if(curAudio)curAudio.volume=vol;}
  else if(e.key==='s'||e.key==='S')toggleShuffle();
  else if(e.key==='r'||e.key==='R')toggleRepeat();
  else if(e.key==='m'||e.key==='M')toggleMute();
});

/* ── INIT ── */
renderPL();
</script>
